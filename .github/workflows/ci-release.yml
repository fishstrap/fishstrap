name: CI (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish XPLSTRAP
      run: dotnet publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained true .\\Bloxstrap\\Bloxstrap.csproj

    - name: Create dedicated setup executable
      shell: pwsh
      run: |
        $publishDir = ".\\Bloxstrap\\bin\\Release\\net6.0-windows\\win-x64\\publish"
        $launcher = Join-Path $publishDir "XPLSTRAP.exe"
        $setup = Join-Path $publishDir "XPLSTRAP-Setup.exe"

        if (-not (Test-Path -LiteralPath $launcher)) {
          throw "Published launcher was not found: $launcher"
        }

        Copy-Item -LiteralPath $launcher -Destination $setup -Force
        Write-Host "Created $setup"

    - name: Upload XPLSTRAP executables
      uses: actions/upload-artifact@v7
      with:
        name: XPLSTRAP-Windows-x64
        path: |
          .\\Bloxstrap\\bin\\Release\\net6.0-windows\\win-x64\\publish\\XPLSTRAP.exe
          .\\Bloxstrap\\bin\\Release\\net6.0-windows\\win-x64\\publish\\XPLSTRAP-Setup.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download XPLSTRAP executables
        uses: actions/download-artifact@v8
        with:
          name: XPLSTRAP-Windows-x64
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            release/XPLSTRAP.exe
            release/XPLSTRAP-Setup.exe
          name: XPLSTRAP ${{ github.ref_name }}
          fail_on_unmatched_files: true

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')
    permissions:
      contents: write

    steps:
      - name: Download XPLSTRAP executables
        uses: actions/download-artifact@v8
        with:
          name: XPLSTRAP-Windows-x64
          path: release

      - name: Create test release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            release/XPLSTRAP.exe
            release/XPLSTRAP-Setup.exe
          name: XPLSTRAP Test ${{ github.ref_name }}
          fail_on_unmatched_files: true
