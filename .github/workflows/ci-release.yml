name: CI (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish XPLSTRAP Setup
      run: dotnet publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained true .\\Bloxstrap\\Bloxstrap.csproj

    - name: Upload XPLSTRAP Setup
      uses: actions/upload-artifact@v7
      with:
        name: XPLSTRAP-Setup
        path: .\\Bloxstrap\\bin\\Release\\net6.0-windows\\win-x64\\publish\\XPLSTRAP.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download XPLSTRAP Setup
        uses: actions/download-artifact@v8
        with:
          name: XPLSTRAP-Setup
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/XPLSTRAP.exe
          name: XPLSTRAP ${{ github.ref_name }}
          fail_on_unmatched_files: true

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')
    permissions:
      contents: write

    steps:
      - name: Download XPLSTRAP Setup
        uses: actions/download-artifact@v8
        with:
          name: XPLSTRAP-Setup
          path: release

      - name: Create test release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/XPLSTRAP.exe
          name: XPLSTRAP Test ${{ github.ref_name }}
          fail_on_unmatched_files: true
